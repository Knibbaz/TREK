services:
  app:
    image: basabbink/routd:latest
    container_name: routd
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    # We halen ports: 3000:3000 weg omdat Caddy het intern afhandelt via het netwerk
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - APP_URL=${APP_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FORCE_HTTPS=false
      - TRUST_PROXY=1
    volumes:
      - routd_data:/app/data
      - routd_uploads:/app/uploads
    restart: unless-stopped
    networks:
      - routd-network

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - routd-network

networks:
  routd-network:

volumes:
  routd_data:
  routd_uploads:
  caddy_data:
    external: true
  caddy_config: