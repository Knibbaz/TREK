services:
  app:
    image: basabbink/routd:latest
    container_name: routd
    # Platform wordt automatisch gedetecteerd door Docker op de server,
    # maar kun je expliciet zetten als je lokaal test: linux/amd64 of linux/arm64
    # platform: linux/amd64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEFAULT_LANGUAGE=en
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@routd.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - COOKIE_SECURE=false
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
